# Rename this file to config.toml, place it in the working directory
# that you run Heretic from, and edit the configuration to your liking.
#
# BERTClassifier scorer instead of the default KeywordRate.
# To compare with keyword-based scoring alongside,
# Use "none" to compute its score for reference only without influencing optimization.
# Or use "minimize" to use its scores for optimization as well.
#
# { plugin = "heretic.scorers.keyword_rate.KeywordRate", optimization = "none" }

scorers = [
    { plugin = "heretic.scorers.bert_classifier.BERTClassifier", optimization = "minimize" },
    { plugin = "heretic.scorers.kl_divergence.KLDivergence", optimization = "minimize" },
]
