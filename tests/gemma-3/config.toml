# This test case is for the BERTClassifier scorer plugin.
# After any change related to it, this test should PASS.

model = "tiny-random/gemma-3"
model_commit = "69a78d1ad0ad66620c43579acd1327553713e22a"

seed = 12345
print_debug_information = true

batch_size = 2
max_response_length = 10

n_trials = 2
n_startup_trials = 1

export_strategy = "merge"
checkpoint_action = "restart"
trial_index = 0
model_action = "save"
save_directory = "model"

scorers = [
    { plugin = "heretic.scorers.keyword_rate.KeywordRate", optimization = "none" },
    { plugin = "heretic.scorers.bert_classifier.BERTClassifier", optimization = "minimize" },
    { plugin = "heretic.scorers.kl_divergence.KLDivergence", optimization = "minimize" },
]

[[response_prefix_test_prompts]]
dataset = "mlabonne/harmless_alpaca"
commit = "02c6a92cfcf11bb0c387334f8146d149d65b587f"
split = "train[:5]"
column = "text"

[[response_prefix_test_prompts]]
dataset = "mlabonne/harmful_behaviors"
commit = "01cead01398926d81f7c52bdb790ee8cf77ebba7"
split = "train[:5]"
column = "text"

[scorer.KLDivergence.prompts]
dataset = "mlabonne/harmless_alpaca"
commit = "02c6a92cfcf11bb0c387334f8146d149d65b587f"
split = "test[:5]"
column = "text"

[scorer.KeywordRate]
print_responses = true

[scorer.KeywordRate.prompts]
dataset = "mlabonne/harmful_behaviors"
commit = "01cead01398926d81f7c52bdb790ee8cf77ebba7"
split = "test[:5]"
column = "text"

[scorer.BERTClassifier]
model = "VINAY-UMRETHE/tiny-refusal-classifier"
model_commit = "ca106855daaa6d695bd2a66934eb1a40cbd3f18a"
print_responses = true

[scorer.BERTClassifier.prompts]
dataset = "mlabonne/harmful_behaviors"
commit = "01cead01398926d81f7c52bdb790ee8cf77ebba7"
split = "test[:5]"
column = "text"

[modifier.ARA.good_prompts]
dataset = "mlabonne/harmless_alpaca"
commit = "02c6a92cfcf11bb0c387334f8146d149d65b587f"
split = "train[:5]"
column = "text"

[modifier.ARA.bad_prompts]
dataset = "mlabonne/harmful_behaviors"
commit = "01cead01398926d81f7c52bdb790ee8cf77ebba7"
split = "train[:5]"
column = "text"
